<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Cypher AI</title>

<style>

:root{
    --bg:#090c10;
    --panel:#0f141a;
    --panel2:#151b23;
    --border:#28313c;
    --text:#f5f7fa;
    --muted:#8b96a5;
    --blue:#3b82f6;
    --blue2:#2563eb;
    --green:#22c55e;
    --danger:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);

    overscroll-behavior:none;
}

body{
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ================= HEADER ================= */

header{
    height:60px;
    min-height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:rgba(15,20,26,.97);
    border-bottom:1px solid var(--border);

    z-index:20;
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:34px;
    height:34px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    font-weight:800;
}

.header-title{
    font-size:15px;
    font-weight:700;
}

.status{
    display:flex;
    align-items:center;
    gap:5px;

    font-size:10px;
    color:var(--muted);
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 8px var(--green);
}

.icon-btn{
    width:38px;
    height:38px;

    border:0;
    border-radius:10px;

    background:transparent;
    color:var(--muted);

    display:flex;
    align-items:center;
    justify-content:center;
}

.action-btn{
    border:1px solid var(--border);
    background:#131920;
    color:var(--muted);

    padding:7px 10px;
    border-radius:8px;

    font-size:11px;
}

/* ================= CHAT ================= */

.chat-container{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:18px 14px 20px;

    display:flex;
    flex-direction:column;

    gap:15px;

    -webkit-overflow-scrolling:touch;
}

.message{
    max-width:88%;

    padding:11px 14px;

    border-radius:15px;

    font-size:14px;
    line-height:1.65;

    white-space:pre-wrap;
    word-break:break-word;
}

.message.user{
    align-self:flex-start;

    background:linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    color:white;

    border-bottom-right-radius:5px;
}

.message.ai{
    align-self:flex-end;

    background:#171d25;

    border:1px solid var(--border);

    border-bottom-left-radius:5px;
}

/* ================= MESSAGE IMAGES ================= */

.msg-images{
    display:flex;
    flex-wrap:wrap;

    gap:7px;

    margin-top:8px;
}

.msg-image{
    width:130px;
    height:130px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.18);

    background:#000;
}

/* ================= MESSAGE FILES ================= */

.msg-files{
    display:flex;
    flex-direction:column;

    gap:7px;

    margin-top:8px;
}

.msg-file{
    display:flex;
    align-items:center;
    gap:9px;

    padding:9px;

    background:rgba(0,0,0,.2);

    border:1px solid rgba(255,255,255,.15);

    border-radius:9px;
}

.file-icon{
    width:34px;
    height:34px;

    border-radius:8px;

    background:#202832;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
}

.file-info{
    min-width:0;
    flex:1;
}

.file-name{
    font-size:12px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-type{
    color:var(--muted);
    font-size:9px;
}

/* ================= INPUT ================= */

.input-area{
    flex-shrink:0;

    padding:
        9px
        11px
        calc(9px + env(safe-area-inset-bottom));

    background:rgba(15,20,26,.98);

    border-top:1px solid var(--border);
}

.composer{
    width:100%;

    min-height:50px;

    display:flex;
    align-items:flex-end;

    gap:7px;

    padding:6px;

    border:1px solid #303a46;

    border-radius:15px;

    background:#0b1015;
}

/* ================= ATTACH BUTTON ================= */

.attach-btn{
    width:36px;
    height:36px;

    flex-shrink:0;

    border:0;
    border-radius:10px;

    background:#171e27;

    color:#9ba7b5;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= ATTACHMENT PREVIEW ================= */

.attachments{
    display:none;

    max-width:115px;

    gap:5px;

    overflow-x:auto;

    align-items:center;

    flex-shrink:0;
}

.attachments.active{
    display:flex;
}

.attachment{
    position:relative;

    width:38px;
    height:38px;

    min-width:38px;
}

.attachment img{
    width:38px;
    height:38px;

    object-fit:cover;

    border-radius:8px;

    border:1px solid #3c4652;

    background:#000;
}

.attachment.file{
    width:42px;
    height:38px;

    min-width:42px;

    border-radius:8px;

    background:#18202a;

    border:1px solid #303a46;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
}

.remove-file{
    position:absolute;

    top:-6px;
    right:-6px;

    width:17px;
    height:17px;

    border:0;
    border-radius:50%;

    background:var(--danger);

    color:white;

    font-size:9px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= TEXTAREA ================= */

#userInput{

    flex:1;

    min-width:0;

    height:38px;

    max-height:120px;

    resize:none;

    border:0;

    outline:none;

    background:transparent;

    color:#fff;

    padding:7px 5px;

    /*
      مهم جداً للآيفون:
      أقل من 16px يسبب Zoom عند الكتابة.
    */
    font-size:16px;

    line-height:1.45;

    -webkit-appearance:none;
}

#userInput::placeholder{
    color:#66717e;
}

/* ================= SEND ================= */

.send-btn{
    width:38px;
    height:38px;

    flex-shrink:0;

    border:0;
    border-radius:11px;

    background:linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;
}

.footer{
    text-align:center;

    color:#596574;

    font-size:9px;

    margin-top:6px;
}

/* ================= SIDEBAR ================= */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.62);

    z-index:90;

    display:none;
}

.overlay.active{
    display:block;
}

.sidebar{
    position:fixed;

    top:0;
    right:-300px;

    width:300px;
    height:100%;

    background:#10151b;

    border-left:1px solid var(--border);

    z-index:100;

    transition:right .25s ease;

    padding:15px;
}

.sidebar.open{
    right:0;
}

.sidebar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding-bottom:13px;

    border-bottom:1px solid var(--border);

    margin-bottom:12px;
}

.history{
    display:flex;
    flex-direction:column;

    gap:7px;
}

.history-item{
    padding:12px;

    background:#0b1015;

    border:1px solid transparent;

    border-radius:10px;

    color:#9aa5b2;

    font-size:12px;
}

/* ================= IMAGE VIEWER ================= */

.viewer{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.94);

    padding:20px;
}

.viewer.active{
    display:flex;
}

.viewer img{
    max-width:100%;
    max-height:85vh;

    object-fit:contain;

    border-radius:10px;
}

.viewer-close{
    position:absolute;

    top:18px;
    right:18px;

    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#202832;

    color:white;

    font-size:18px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <b>المحادثات</b>

        <button class="action-btn" id="closeSidebar">
            إغلاق
        </button>

    </div>

    <div class="history">

        <div class="history-item" id="newChat">
            ＋ محادثة جديدة
        </div>

        <div class="history-item">
            مشروع Python
        </div>

        <div class="history-item">
            Roblox AI Builder
        </div>

        <div class="history-item">
            تصميم واجهة Cypher
        </div>

    </div>

</div>


<!-- HEADER -->

<header>

    <div class="header-left">

        <button class="icon-btn" id="menuBtn">

            <svg width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M3 6h18"/>
                <path d="M3 12h18"/>
                <path d="M3 18h18"/>

            </svg>

        </button>

        <div class="logo">
            C
        </div>

        <div>

            <div class="header-title">
                Cypher AI
            </div>

            <div class="status">

                <span class="status-dot"></span>

                Online

            </div>

        </div>

    </div>

    <button class="action-btn" id="clearBtn">
        مسح
    </button>

</header>


<!-- CHAT -->

<div class="chat-container" id="chatContainer">

    <div class="message ai">
        أهلاً بك 👋
        <br>
        أنا Cypher AI.
        <br>
        اكتب رسالتك أو أرفق أي ملف.
    </div>

</div>


<!-- IMAGE VIEWER -->

<div class="viewer" id="viewer">

    <button class="viewer-close" id="viewerClose">
        ✕
    </button>

    <img id="viewerImage">

</div>


<!-- INPUT -->

<div class="input-area">

    <div class="composer">

        <!-- FILE BUTTON -->

        <button class="attach-btn" id="attachBtn">

            <svg width="19"
                 height="19"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>

            </svg>

        </button>


        <!-- ATTACHMENTS -->

        <div class="attachments"
             id="attachments">
        </div>


        <!-- TEXT -->

        <textarea
            id="userInput"
            rows="1"
            placeholder="اكتب رسالتك..."
            autocomplete="off"
            autocorrect="on"
            spellcheck="true">
        </textarea>


        <!-- SEND -->

        <button class="send-btn"
                id="sendBtn">

            <svg width="18"
                 height="18"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.2">

                <line x1="22"
                      y1="2"
                      x2="11"
                      y2="13"/>

                <polygon
                    points="22 2 15 22 11 13 2 9 22 2"/>

            </svg>

        </button>

    </div>

    <div class="footer">
        Cypher AI • Custom Control
    </div>

</div>


<!-- ALL FILE TYPES -->

<input
    type="file"
    id="fileInput"
    multiple
    accept="*/*"
    style="display:none"
>


<script>

/* ================= ELEMENTS ================= */

const chat =
    document.getElementById("chatContainer");

const input =
    document.getElementById("userInput");

const send =
    document.getElementById("sendBtn");

const attach =
    document.getElementById("attachBtn");

const fileInput =
    document.getElementById("fileInput");

const attachments =
    document.getElementById("attachments");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const viewerClose =
    document.getElementById("viewerClose");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");


/* ================= FILE STATE ================= */

let attachedFiles = [];


/* ================= SIDEBAR ================= */

document
.getElementById("menuBtn")
.addEventListener("click",function(){

    sidebar.classList.add("open");
    overlay.classList.add("active");

});


function closeSidebar(){

    sidebar.classList.remove("open");
    overlay.classList.remove("active");

}


document
.getElementById("closeSidebar")
.addEventListener(
    "click",
    closeSidebar
);


overlay.addEventListener(
    "click",
    closeSidebar
);


/* ================= SELECT ANY FILE ================= */

attach.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function(){

        const files =
            Array.from(fileInput.files || []);

        files.forEach(function(file){

            const url =
                URL.createObjectURL(file);

            attachedFiles.push({

                file:file,

                url:url,

                name:file.name,

                type:file.type || "unknown",

                size:file.size

            });

        });


        fileInput.value="";

        renderAttachments();

    }
);


/* ================= FILE ICON ================= */

function getFileIcon(file){

    const type =
        file.type || "";

    const name =
        file.name.toLowerCase();


    if(type.startsWith("image/"))
        return "🖼️";

    if(type.startsWith("video/"))
        return "🎬";

    if(type.startsWith("audio/"))
        return "🎵";

    if(type.includes("pdf") ||
       name.endsWith(".pdf"))
        return "📕";

    if(name.endsWith(".zip") ||
       name.endsWith(".rar") ||
       name.endsWith(".7z"))
        return "📦";

    if(name.endsWith(".js") ||
       name.endsWith(".ts") ||
       name.endsWith(".html") ||
       name.endsWith(".css") ||
       name.endsWith(".lua") ||
       name.endsWith(".py") ||
       name.endsWith(".json"))
        return "💻";

    if(name.endsWith(".doc") ||
       name.endsWith(".docx"))
        return "📘";

    if(name.endsWith(".xls") ||
       name.endsWith(".xlsx"))
        return "📊";

    return "📄";

}


/* ================= SIZE ================= */

function formatSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    if(bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(1) + " MB";

    return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";

}


/* ================= RENDER ATTACHMENTS ================= */

function renderAttachments(){

    attachments.innerHTML="";


    if(attachedFiles.length === 0){

        attachments.classList.remove("active");

        return;

    }


    attachments.classList.add("active");


    attachedFiles.forEach(
        function(item,index){

            const box =
                document.createElement("div");


            box.className =
                "attachment";


            /* IMAGE */

            if(item.type.startsWith("image/")){

                const img =
                    document.createElement("img");

                img.src=item.url;

                img.addEventListener(
                    "click",
                    function(){

                        openViewer(item.url);

                    }
                );

                box.appendChild(img);

            }

            /* OTHER FILE */

            else{

                box.classList.add("file");

                box.textContent =
                    getFileIcon(item.file);

            }


            /* REMOVE */

            const remove =
                document.createElement("button");

            remove.className =
                "remove-file";

            remove.textContent="✕";


            remove.addEventListener(
                "click",
                function(e){

                    e.stopPropagation();

                    URL.revokeObjectURL(
                        item.url
                    );

                    attachedFiles.splice(
                        index,
                        1
                    );

                    renderAttachments();

                }
            );


            box.appendChild(remove);

            attachments.appendChild(box);

        }
    );

}


/* ================= VIEW IMAGE ================= */

function openViewer(src){

    viewerImage.src=src;

    viewer.classList.add("active");

}


viewerClose.addEventListener(
    "click",
    function(){

        viewer.classList.remove("active");

    }
);


viewer.addEventListener(
    "click",
    function(e){

        if(e.target === viewer){

            viewer.classList.remove("active");

        }

    }
);


/* ================= SEND ================= */

function sendMessage(){

    const text =
        input.value.trim();


    if(
        text === "" &&
        attachedFiles.length === 0
    ){

        return;

    }


    const message =
        document.createElement("div");

    message.className =
        "message user";


    /* TEXT */

    if(text !== ""){

        const textElement =
            document.createElement("div");

        textElement.textContent =
            text;

        message.appendChild(
            textElement
        );

    }


    /* FILES */

    if(attachedFiles.length > 0){

        const imagesBox =
            document.createElement("div");

        imagesBox.className =
            "msg-images";


        const filesBox =
            document.createElement("div");

        filesBox.className =
            "msg-files";


        attachedFiles.forEach(
            function(item){

                /* IMAGE */

                if(
                    item.type.startsWith("image/")
                ){

                    const img =
                        document.createElement("img");

                    img.className =
                        "msg-image";

                    img.src =
                        item.url;


                    img.addEventListener(
                        "click",
                        function(){

                            openViewer(
                                item.url
                            );

                        }
                    );


                    imagesBox.appendChild(
                        img
                    );

                }

                /* OTHER FILE */

                else{

                    const fileBox =
                        document.createElement("div");

                    fileBox.className =
                        "msg-file";


                    const icon =
                        document.createElement("div");

                    icon.className =
                        "file-icon";

                    icon.textContent =
                        getFileIcon(item.file);


                    const info =
                        document.createElement("div");

                    info.className =
                        "file-info";


                    const name =
                        document.createElement("div");

                    name.className =
                        "file-name";

                    name.textContent =
                        item.name;


                    const type =
                        document.createElement("div");

                    type.className =
                        "file-type";

                    type.textContent =
                        formatSize(item.size);


                    info.appendChild(name);
                    info.appendChild(type);


                    fileBox.appendChild(icon);
                    fileBox.appendChild(info);


                    filesBox.appendChild(
                        fileBox
                    );

                }

            }
        );


        if(imagesBox.children.length > 0){

            message.appendChild(
                imagesBox
            );

        }


        if(filesBox.children.length > 0){

            message.appendChild(
                filesBox
            );

        }

    }


    chat.appendChild(message);


    /* RESET */

    input.value="";


    attachedFiles.forEach(
        function(item){

            /*
             * لا نحذف Object URL هنا
             * لأن الصور تحتاجه بعد الإرسال.
             */

        }
    );


    attachedFiles=[];

    attachments.innerHTML="";

    attachments.classList.remove(
        "active"
    );


    autoResize();

    scrollChat();


    /* DEMO RESPONSE */

    setTimeout(
        function(){

            const ai =
                document.createElement("div");

            ai.className =
                "message ai";

            ai.textContent =
                "تم استلام الرسالة والملفات بنجاح.\n\nالواجهة جاهزة الآن لربط API الحقيقي.";

            chat.appendChild(ai);

            scrollChat();

        },
        700
    );

}


/* ================= SEND BUTTON ================= */

send.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        sendMessage();

    }
);


/* ================= ENTER ================= */

input.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* ================= AUTO RESIZE ================= */

input.addEventListener(
    "input",
    autoResize
);


function autoResize(){

    input.style.height="38px";

    input.style.height =
        Math.min(
            input.scrollHeight,
            120
        ) + "px";

}


/* ================= SCROLL ================= */

function scrollChat(){

    requestAnimationFrame(
        function(){

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* ================= CLEAR ================= */

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    function(){

        chat.innerHTML="";

        const welcome =
            document.createElement("div");

        welcome.className =
            "message ai";

        welcome.textContent =
            "تم مسح المحادثة. ابدأ من جديد.";

        chat.appendChild(welcome);

    }
);


/* ================= NEW CHAT ================= */

document
.getElementById("newChat")
.addEventListener(
    "click",
    function(){

        chat.innerHTML="";

        const welcome =
            document.createElement("div");

        welcome.className =
            "message ai";

        welcome.textContent =
            "محادثة جديدة جاهزة.";

        chat.appendChild(welcome);

        closeSidebar();

    }
);


/* ================= START ================= */

autoResize();

</script>

</body>
</html>
